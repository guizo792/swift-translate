<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Swift Translate</title>
  <style>
    :root { --bg: #ffffff; --card: #f8f9fa; --text: #202124; --muted: #5f6368; --line: #dadce0; --accent: #1a73e8; --hover: #f1f3f4; }
    :root[data-theme="dark"] { --bg: #202124; --card: #2d2e31; --text: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --accent: #8ab4f8; --hover: #3c4043; }
    :root { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { width: 320px; margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, Arial, sans-serif; }

    header { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; padding: 18px 18px 20px; color: #fff;
      background: radial-gradient(120px 80px at 100% 0, rgba(255,255,255,.22), transparent 70%), linear-gradient(135deg, #1a73e8 0%, #1557b0 100%); }
    :root[data-theme="dark"] header { background: radial-gradient(120px 80px at 100% 0, rgba(138,180,248,.28), transparent 70%), linear-gradient(135deg, #1d4f9f 0%, #153a78 100%); }
    header img { width: 44px; height: 44px; flex: none; filter: drop-shadow(0 3px 8px rgba(0,0,0,.35)); animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
    h1 { font-size: 18px; font-weight: 700; letter-spacing: -.2px; margin: 0; line-height: 1.15; }
    header p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
    main { padding: 16px 18px 18px; animation: rise .35s ease-out both; }
    @keyframes pop { from { transform: scale(.6) rotate(-8deg); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

    .label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    .field { position: relative; }
    .field svg { position: absolute; right: 12px; top: 50%; width: 18px; height: 18px; margin-top: -9px; fill: var(--muted); pointer-events: none; }
    input[type=text] { width: 100%; padding: 10px 36px 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; }
    input[type=text]:hover { border-color: var(--muted); }
    input[type=text]:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); background: var(--bg); }
    ul { list-style: none; margin: 6px 0 0; padding: 4px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; max-height: 170px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
    li { padding: 7px 10px; border-radius: 6px; cursor: pointer; }
    li.active { background: var(--hover); color: var(--accent); }
    li.empty { color: var(--muted); cursor: default; }

    .card { margin-top: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; cursor: pointer; color: inherit; text-decoration: none; }
    .row + .row { border-top: 1px solid var(--line); }
    a.row:hover { background: var(--hover); }
    .row small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .row .title { font-weight: 500; }
    .row .end { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; flex: none; }
    .row svg { width: 18px; height: 18px; fill: var(--muted); }
    #count:not(:empty) { background: var(--accent); color: #fff; font-weight: 600; min-width: 22px; text-align: center; padding: 1px 8px; border-radius: 999px; }
    :root[data-theme="dark"] #count:not(:empty) { color: #202124; }
    .card { box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    a.row svg:last-child { transition: transform .15s; }
    a.row:hover svg:last-child { transform: translateX(3px); }
    .lead { display: flex; align-items: center; gap: 10px; }
    .lead svg { fill: var(--accent); width: 20px; height: 20px; }

    /* the switch */
    .switch { position: relative; width: 36px; height: 20px; flex: none; }
    .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 10px; background: var(--line); transition: background .15s; pointer-events: none; }
    .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .15s; }
    .switch input:checked + span { background: var(--accent); }
    :root[data-theme="dark"] .switch input:checked + span { background: #8ab4f8; }
    .switch input:checked + span::after { transform: translateX(16px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/48.png" alt="">
    <div>
      <h1>Swift Translate</h1>
      <p>Select. Translate. Listen.</p>
    </div>
  </header>
  <main>

  <label class="label" for="lang">Translate into</label>
  <div class="field">
    <input id="lang" type="text" autocomplete="off" spellcheck="false" placeholder="Search languages">
    <svg viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
  </div>
  <ul id="list" hidden></ul>

  <div class="card">
    <label class="row" for="icon">
      <span>
        <span class="title">Selection icon</span>
        <small>Off: right-click a selection and choose Translate Selection</small>
      </span>
      <span class="switch"><input type="checkbox" id="icon"><span></span></span>
    </label>
    <a class="row" id="vocab" href="vocab.html" target="_blank">
      <span class="lead">
        <svg viewBox="0 0 24 24"><path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z"/></svg>
        <span class="title">Saved words</span>
      </span>
      <span class="end"><span id="count"></span><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></span>
    </a>
  </div>
  </main>

  <script src="languages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
