<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saved words</title>
  <style>
    :root {
      --bg: #ffffff; --card: #f8f9fa; --text: #202124; --muted: #5f6368;
      --border: #dadce0; --accent: #1a73e8; --danger: #d93025;
    }
    :root[data-theme="dark"] {
      --bg: #202124; --card: #2d2e31; --text: #e8eaed; --muted: #9aa0a6;
      --border: #3c4043; --accent: #8ab4f8; --danger: #f28b82;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 24px; }
    #count { color: var(--muted); font-size: 14px; }
    .tools { display: flex; gap: 8px; margin: 16px 0 20px; }
    input[type="search"] {
      flex: 1; min-width: 0; padding: 10px 14px; font: inherit; font-size: 14px;
      color: var(--text); background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    }
    button {
      font: inherit; font-size: 14px; cursor: pointer; color: var(--accent);
      background: none; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
    }
    button:hover { background: var(--card); }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px 16px; margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start;
    }
    .card-main { flex: 1; min-width: 0; }
    .word { font-size: 18px; font-weight: 700; }
    .translation { font-size: 18px; margin-top: 2px; }
    .context { margin-top: 8px; font-size: 14px; color: var(--muted); font-style: italic; }
    .meta { margin-top: 8px; font-size: 12px; color: var(--muted); }
    .remove { color: var(--danger); padding: 6px 10px; font-size: 13px; }
    #empty { color: var(--muted); text-align: center; padding: 48px 0; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Saved words</h1>
      <span id="count"></span>
    </header>
    <div class="tools">
      <input type="search" id="search" placeholder="Search words, translations, sentences">
      <button id="export">Export CSV</button>
    </div>
    <div id="list"></div>
    <div id="empty" hidden></div>
  </main>
  <script src="vocab.js"></script>
</body>
</html>
